name: security

# Bundled FOSS security scan via catenahq/scanctl (profile full): detects the
# repo's ecosystems and runs the matching scanners -- gitleaks, osv-scanner,
# trivy fs+license, semgrep, zizmor, guarddog -- merges SARIF to code scanning,
# and emits a CycloneDX SBOM artifact.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  scanctl:
    uses: catenahq/scanctl/.github/workflows/github-reusable.yml@a3a0c815559521f7a72a247830cc307914b1a7fc # main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      profile: full
      runner: ubuntu-latest
